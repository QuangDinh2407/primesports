<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/Common/Admin/LayoutMaster.html}">
<head>
    <title>Product Manage</title>

    <link rel="stylesheet" th:href="@{/Assets/Admin_Employee/Assets/css/vertical-layout-light/employeeInfocss.css}"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        .flatpickr-current-month .flatpickr-monthDropdown-months {
            padding: 0 !important;
        }
        #dateIcon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            color: rgba(0, 0, 0, .8);
            z-index: 1;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .pagination ul {
            list-style: none;
            display: flex;
            gap: 10px;
            padding: 0;
            margin: 0;
        }

        .pagination ul li {
            display: inline;
        }

        .pagination ul li a {
            display: inline-block;
            padding: 8px 12px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: background-color 0.3s, color 0.3s;
        }

        .pagination ul li a:hover {
            background-color: #007bff;
            color: white;
        }

        .pagination ul li.active a {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
            cursor: default;
        }

        .pagination ul li a[disabled] {
            color: #aaa;
            pointer-events: none;
            cursor: not-allowed;
            background-color: #f8f9fa;
            border-color: #ddd;
        }

        #pageSize{
            width: 210px;
            background-color: white;
            color: black;
        }


    </style>
</head>

<body>
<div layout:fragment="content">

    <div class="product-manage-container">
        <div class="product-info-content">
            <div class="product-show-display">
                <div class="col-lg-12 grid-margin stretch-card">
                    <div class="card">
                        <div class="card-body">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                <h4 class="card-title">Quản lý đơn hàng</h4>
                                    <p class="card-description">
                                        Đơn hàng<code>.primesports</code>
                                    </p>
                                </div>
                                <div class="size-page">
                                    <form method="get" th:action="@{/admin/orders}">
                                        <div class="form-group">
                                            <label for="pageSize">Số lượng đơn hàng hiển thị:</label>
                                            <select id="pageSize" name="pageSize" class="form-control" onchange="this.form.submit()">
                                                <option th:selected="${pageSize == 5}" value="5">5</option>
                                                <option th:selected="${pageSize == 10}" value="10">10</option>
                                                <option th:selected="${pageSize == 20}" value="20">20</option>
                                            </select>
                                        </div>
                                    </form>
                                </div>
                            </div>



                            <form th:action="@{/admin/order/filter}" method="POST" id="filterForm">
                                <div class="filter-container">
                                    <!-- Filter item to open modal -->
                                    <div class="filter-item ">
                                        <label for="priceRange">Tổng đơn</label>
                                        <div class="price-range filter-price">
                                            <input type="text" id="beginPrice" name="beginPrice" class="form-control" placeholder="Từ giá">
                                            <span>-</span>
                                            <input type="text" id="endPrice" name="endPrice" class="form-control" placeholder="Đến giá">
                                        </div>
                                    </div>

                                    <div class="filter-item ">
                                        <label for="dateRange">Thời gian đặt</label>
                                        <div class="price-range filter-price">
                                            <input type="date" id="beginDate" name="beginDate" class="form-control" placeholder="Từ ngày">
                                            <span>-</span>
                                            <input type="date" id="endDate" name="endDate" class="form-control" placeholder="Đến ngày   ">
                                        </div>
                                    </div>

                                    <div class="filter-item">
                                        <label for="status">Trạng thái</label>
                                        <select id="status" name="status" class="form-control">
                                            <option value="">Chọn tình trạng</option>
                                            <option value="Đã giao">Đã giao</option>
                                            <option value="Đang giao">Đang giao</option>
                                            <option value="Đã hủy">Đã hủy</option>
                                            <option value="Đang chuẩn bị">Đang chuẩn bị</option>
                                        </select>
                                    </div>

                                    <div class="filter-item">
                                        <button type="submit" class="">Tìm kiếm</button>
                                    </div>

                                </div>
                            </form>

                            <div class="">
                                <table class="table-custom">
                                    <colgroup>
                                        <col style="width: 5%;">   <!-- Cột STT -->
                                        <col style="width: 25%;">  <!-- Tên sản phẩm -->
                                        <col style="width: 10%;">  <!-- Ảnh -->
                                        <col style="width: 15%;">  <!-- Giá -->
                                        <col style="width: 10%;">  <!-- Số lượng -->
                                        <col style="width: 15%;">  <!-- Trạng thái -->
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th>
                                            #
                                        </th>
                                        <th>
                                            Mã đơn hàng
                                        </th>
                                        <th>
                                            Tổng đơn
                                        </th>
                                        <th>
                                            Thanh toán
                                        </th>
                                        <th>
                                            Địa chỉ
                                        </th>
                                        <th>
                                            Trạng thái
                                        </th>
                                        <th>
                                            Đặt lúc
                                        </th>
                                        <th>
                                            Hành động
                                        </th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="order, stat : ${orders}">
                                        <td th:text="${stat.index + 1}"></td> <!-- Thứ tự -->
                                        <!--                                        <td th:text="${product.name}"></td> &lt;!&ndash; Tên sản phẩm &ndash;&gt;-->
                                        <td>
                                            <a th:href="@{/admin/order/view/{id}(id=${order.userOrder_id})}" th:text="${order.userOrder_id}"></a>
                                        </td>

                                        <td th:text="${@currencyFormatter.formatCurrency(order.total_price)}"></td>
                                        <td th:text="${order.paymentType.name}"></td>
                                        <td th:text="${order.shipping_address}"></td>

                                        <td>
                                        <span th:if="${order.status == 'Đã giao'}"  class="badge badge-success" th:text="${order.status}"></span>
                                        <span th:if="${order.status == 'Đang giao'}" class="badge badge-warning" th:text="${order.status}"></span>
                                        <span th:if="${order.status == 'Đang chuẩn bị'}" class="badge badge-info" th:text="${order.status}"></span>
                                        <span th:if="${order.status == 'Đã hủy'}" class="badge badge-danger" th:text="${order.status}"></span>

                                        </td>
                                        <td th:text="${order.updated_at}"></td>
                                        <td>
                                            <button type="button" class="btn btn-danger btn-sm"
                                                    th:attr="onclick='openDeleteModal(' +'\''+ ${order.updated_at} + '\''+ ')'">Xóa</button>

                                        </td>

                                    </tr>
                                    </tbody>
                                </table>
                                <div th:if="${#lists.isEmpty(orders)}">
                                    <div th:replace="~{/Common/Admin/NoData :: NoData}"></div>
                                </div>
                            </div>

                            <div class="pagination">
                                <ul>
                                    <li th:if="${currentPage > 0}">
                                        <a th:href="@{/admin/orders(page=${currentPage - 1}, pageSize=${pageSize})}">&laquo; Previous</a>
                                    </li>
                                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                        th:classappend="${i == currentPage} ? 'active'">
                                        <a th:href="@{/admin/orders(page=${i}, pageSize=${pageSize})}" th:text="${i + 1}"></a>
                                    </li>
                                    <li th:if="${currentPage < totalPages - 1}">
                                        <a th:href="@{/admin/orders(page=${currentPage + 1}, pageSize=${pageSize})}">Next &raquo;</a>
                                    </li>
                                </ul>
                            </div>

<!--                            <div class="pagination">-->
<!--                                <ul id="pagination"></ul>-->
<!--                            </div>-->


                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>
    <div id="deleteModal" class="modal__custom">
        <div class="modal__content">
            <span class="close" onclick="closeDeleteModal()">&times;</span>
            <h3>Xác nhận xóa</h3>
            <p>Bạn có chắc chắn muốn xóa sản phẩm này?</p>
            <form id="deleteForm" th:action="@{/admin/product/delete}" method="post">
                <input type="hidden" id="productIdInput" name="id" value="">
                <button type="submit" class="btn btn-danger">Xóa</button>
                <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Hủy</button>
            </form>
        </div>
    </div>


</div>
<!--THÊM-->
<div layout:fragment="script">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/flatpickr.min.js"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
    <script>
        document.getElementById("avatar-upload").addEventListener("change", function () {
            const fileName = this.files.length > 0 ? this.files[0].name : "Chưa có file nào được chọn";
            document.getElementById("file-name").textContent = fileName;
        });
    </script>
    <script>

        const modal = document.getElementById('productModal');
        const closeModalButton = document.getElementById('closeModal');
        const okButton = document.getElementById('okButton');
        const productTypeDiv = document.getElementById('productType');

        function openModal() {
            modal.style.display = 'flex';  // Hiển thị modal
        }

        function closeModal() {
            modal.style.display = 'none';  // Ẩn modal
        }
        productTypeDiv.addEventListener('click', openModal);

        okButton.addEventListener('click', closeModal);

        closeModalButton.addEventListener('click', closeModal);

        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                closeModal();
            }
        });

    </script>
    <script>
        const datePicker = flatpickr("#dateInput", {
            dateFormat: "d-m-Y",
            locale: "vn",
            onChange: function (selectedDates, dateStr, instance) {
                document.getElementById('dateInput').value = dateStr;
            }
        });

        const dateIcon = document.querySelector('#dateIcon');
        dateIcon.addEventListener('click', function () {
            datePicker.open();
        });

        function openDeleteModal(productId) {
            // Hiển thị hộp thoại
            const modal = document.getElementById("deleteModal");
            modal.style.display = "flex";

            // Gắn ID sản phẩm vào input hidden
            const productIdInput = document.getElementById("productIdInput");
            productIdInput.value = productId;
        }

        function closeDeleteModal() {
            // Ẩn hộp thoại
            const modal = document.getElementById("deleteModal");
            modal.style.display = "none";
        }
    </script>
