<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>primesports</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="76x76" th:href="@{/Assets/Customer_Shop/Assets/favicon/logo.png}" />
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/Assets/Customer_Shop/Assets/favicon/logo.png}" />
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/Assets/Customer_Shop/Assets/favicon/logo.png}" />
    <link rel="manifest" th:href="@{/Assets/Customer_Shop/Assets/favicon/logo.png}" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Fonts -->
    <link rel="stylesheet" th:href="@{/Assets/Customer_Shop/Assets/fonts/stylesheet.css}" />

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/Assets/Customer_Shop/Assets/css/main.css}" />
    <link rel="stylesheet" th:href="@{/Assets/Customer_Shop/Assets/css/pagination.css}" />
    <link rel="stylesheet" th:href="@{/Assets/Customer_Shop/Assets/css/search-bar.css}" />

    <!-- Scripts -->
    <script th:src="@{/Assets/Customer_Shop/Assets/js/scripts.js}" ></script>
</head>
<style>
    img.prev-icon {
        transform: rotate(180deg);
    }
    .error-message {
        color: red;
        font-size: 15px;
        font-weight: 600;
        margin-top: 5px;
        margin-bottom: 5px;
        margin-left: 10px;
    }
    .no-data{
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .no-data img{
        width: 128px;
    }
    .no-data h1{
        font-size: 2.5rem;
        font-weight: 600;
    }
    .size-focus{
        border: #0ba1b5 1px solid;
    }
    .amount-input{
        display: flex;
        justify-content: flex-start;
        align-items: center;
    }

    .amount-input p{
        margin: 0 10px;
    }

    .amount-input input{
        width: 25px;
    }
    .checkbox-item{
        width: 20px;
        height: 20px;
    }
</style>

<body>
<!-- Header -->
<header id="header" class="header"></header>
<div></div>
<script>
    load("#header", "/header");
</script>

<!-- MAIN -->
<main class="product-page">
    <div class="container">
        <!-- Search bar -->
        <div style="height: 110px"></div>
        <div class="checkout-container">
            <form th:action="@{/action-cart}" method="post" th:object="${actionCart}">
                <input type="hidden" name="cartId" th:value="${cartDTO.cart_id}">
                <input type="hidden" name="action">
                <div class="row gy-xl-3">
                    <div class="col-8 col-xl-12">
                        <div class="cart-info">
                            <div class="cart-info__list">
                                <!-- Cart item 1 -->
                                <article class="cart-item" style="padding-top:0">
                                    <div class="cart-item__content">
                                        <div class="cart-item__content-left">
                                        </div>
                                        <div class="cart-item__content-right" style="flex-direction: row;align-items: center;">
                                            <p class="cart-info__next-btn btn btn--primary btn--rounded"> Chọn tất cả </p>
                                        </div>
                                    </div>
                                </article>
                                <div th:if="${#lists.isEmpty(cartDTO.cartDetailItems)}"  class="no-data">
                                    <img th:src="@{/Assets/Customer_Shop/Assets/icons/no-data128px.png}">
                                    <h1>Không có sản phẩm trong giỏ hàng!</h1>
                                </div>
                                <article class="cart-item" th:each="productItem : ${cartDTO.cartDetailItems}">
                                    <a th:href="@{/product-detail/{id}(id=${productItem.product.product_id})}">
                                        <img th:src="@{${productItem.product.getImagePaths[0]}}"  alt="" class="cart-item__thumb"/>
                                    </a>
                                    <div class="cart-item__content">
                                        <div class="cart-item__content-left">
                                            <h3 class="cart-item__title">
                                                <a th:href="@{/product-detail/{id}(id=${productItem.product.product_id})}" th:text="${productItem.product.name}"></a>
                                            </h3>
                                            <p class="cart-item__price-wrap" th:text="${productItem.product.price}"></p>
                                            <div class="cart-item__ctrl cart-item__ctrl--md-block">
                                                <div class="cart-item__input">
                                                    <span>Số lượng: <span th:text="${productItem.amount}"></span></span>
                                                </div>
                                                <div class="cart-item__input">
                                                    <span>Size: <span th:text="${productItem.size}"></span></span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="cart-item__content-right" style="flex-direction: row;align-items: center;">
                                            <input class="checkbox-item" type="checkbox" name="productId" th:value="${productItem.product.product_id}">
                                            <input type="hidden" name="amount" th:value="${productItem.amount}">
                                            <input type="hidden" name="size" th:value="${productItem.size}">
                                        </div>

                                    </div>
                                </article>
                            </div>
                            <div class="cart-info__bottom d-md-none">
                                <div class="row">
                                    <div class="col-8 col-xxl-7">
                                        <div class="cart-info__continue">
                                            <a th:href="@{/}" class="cart-info__continue-link">
                                                <img class="cart-info__continue-icon icon" src="./assets/icons/arrow-down-2.svg" alt=""/>Tiếp tục mua hàng
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-4 col-xl-12">
                        <div class="cart-info">
                            <div class="cart-info__row">
                                <span>Tổng số lượng sản phẩm <span class="cart-info__sub-label"></span></span>
                                <span th:text="${cartDTO.quantityProduct}"></span>
                            </div>
                            <div class="cart-info__row">
                                <span>Tổng tiền sản phẩm<span class="cart-info__sub-label"></span></span>
                                <span th:text="${cartDTO.totalPrice}"></span>
                            </div>
                            <button id="delete-cart-item" th:href="@{/delete-cart-item}" class="cart-info__next-btn btn btn--primary btn--rounded" style="width: 100%;">Xoá</button>
                            <button id="buy-products" th:href="@{/check-out-from-cart}" class="cart-info__next-btn btn btn--primary btn--rounded" style="width: 100%; margin-left: 0;">Mua sản phẩm</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->

<footer id="footer" class="footer"></footer>

</body>
<script> load("#footer", "/footer");</script>
<script>
    const selectAllButton = document.querySelector('.cart-info__next-btn');
    let isAllSelected = false; // Biến để kiểm tra trạng thái

    selectAllButton.addEventListener('click', function () {
        const checkboxes = document.querySelectorAll('.checkbox-item');
        isAllSelected = !isAllSelected; // Đảo trạng thái

        checkboxes.forEach(checkbox => {
            checkbox.checked = isAllSelected; // Chọn hoặc bỏ chọn tùy trạng thái
        });

        // Cập nhật nội dung nút
        selectAllButton.textContent = isAllSelected ? 'Bỏ chọn tất cả' : 'Chọn tất cả';
    });
</script>
<script>
    // Lấy các nút "Xóa" và "Mua sản phẩm"
    const deleteButton = document.getElementById('delete-cart-item');
    const buyButton = document.getElementById('buy-products');
    const actionInput = document.querySelector('input[name="action"]');

    // Gắn sự kiện cho nút "Xóa"
    deleteButton.addEventListener('click', function (event) {
        event.preventDefault();
        actionInput.value = 'delete';
        const checkboxes = document.querySelectorAll('.checkbox-item');
        checkboxes.forEach((checkbox) => {
            if (!checkbox.checked) {
                // Nếu checkbox không được chọn, vô hiệu hóa các input liên quan
                const parent = checkbox.closest('.cart-item__content-right');
                parent.querySelector('input[name="amount"]').disabled = true;
                parent.querySelector('input[name="size"]').disabled = true;
            }
        });
        deleteButton.closest('form').submit();
    });

    // Gắn sự kiện cho nút "Mua sản phẩm"
    buyButton.addEventListener('click', function (event) {
        event.preventDefault();
        actionInput.value = 'buy';
        const checkboxes = document.querySelectorAll('.checkbox-item');
        checkboxes.forEach((checkbox) => {
            if (!checkbox.checked) {
                // Nếu checkbox không được chọn, vô hiệu hóa các input liên quan
                const parent = checkbox.closest('.cart-item__content-right');
                parent.querySelector('input[name="amount"]').disabled = true;
                parent.querySelector('input[name="size"]').disabled = true;
            }
        });
        buyButton.closest('form').submit();
    });
</script>
</html>
